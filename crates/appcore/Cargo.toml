[package]
name = "mohona-appcore"
description = "What the Mohona desktop app does with the engine, without any window code (so it can be tested)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
mohona-daemon = { version = "0.1.0", path = "../daemon" }
mohona-manager = { version = "0.1.0", path = "../manager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio.workspace = true

[dev-dependencies]
mohona-net = { version = "0.1.0", path = "../net" }
mohona-store = { version = "0.1.0", path = "../store" }
mohona-testserver = { path = "../../tools/testserver" }
tempfile = "3"
