[package]
name = "mohona"
description = "Mohona: a fast, resumable download manager for the command line (HTTP, FTP, SFTP, torrents, HLS)"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "mohona"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap.workspace = true
mohona-core = { version = "0.1.0", path = "../core" }
mohona-daemon = { version = "0.1.0", path = "../daemon" }
mohona-manager = { version = "0.1.0", path = "../manager" }
mohona-media = { version = "0.1.0", path = "../media" }
mohona-net = { version = "0.1.0", path = "../net" }
mohona-store = { version = "0.1.0", path = "../store" }
tokio.workspace = true
url = "2"

[dev-dependencies]
mohona-testserver = { path = "../../tools/testserver" }
sha2 = "0.10"
tempfile = "3"
