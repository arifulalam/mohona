[package]
name = "mohona-cli"
description = "Mohona command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mohona"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap.workspace = true
mohona-core = { path = "../core" }
mohona-manager = { path = "../manager" }
mohona-media = { path = "../media" }
mohona-net = { version = "0.0.1", path = "../net" }
mohona-store = { path = "../store" }
tokio.workspace = true
url = "2"

[dev-dependencies]
mohona-testserver = { path = "../../tools/testserver" }
sha2 = "0.10"
tempfile = "3"
