[package]
name = "mohona-daemon"
description = "Mohona background engine: a local API for the CLI, the browser extension and the app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.4"
mohona-core = { path = "../core" }
mohona-grabber = { path = "../grabber" }
mohona-manager = { path = "../manager" }
mohona-media = { path = "../media" }
mohona-net = { version = "0.0.1", path = "../net" }
mohona-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
mohona-testserver = { path = "../../tools/testserver" }
tempfile = "3"
