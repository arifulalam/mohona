[package]
name = "mohona-manager"
description = "Mohona download manager: many downloads, queues and saved state"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mohona-core = { version = "0.1.0", path = "../core" }
mohona-media = { version = "0.1.0", path = "../media" }
mohona-net = { version = "0.1.0", path = "../net" }
mohona-store = { version = "0.1.0", path = "../store" }
mohona-torrent = { version = "0.1.0", path = "../torrent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio.workspace = true

[dev-dependencies]
mohona-testserver = { path = "../../tools/testserver" }
tempfile = "3"
