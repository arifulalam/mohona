[package]
name = "mohona-torrent"
description = "Mohona BitTorrent downloads (a thin layer over librqbit)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# No web interface and no default TLS: Mohona only needs the peer protocol and DHT.
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
mohona-core = { path = "../core" }
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
