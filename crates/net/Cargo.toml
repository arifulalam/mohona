[package]
name = "mohona-net"
description = "Mohona transports: HTTP, FTP, SFTP, WebDAV, proxies and authentication"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
bytes = "1.12.1"
getrandom = "0.4"
md-5 = "0.10"
percent-encoding = "2.3.2"
# HTTP/1.1 only (no "http2" feature): each segment must use its own TCP
# connection, because HTTP/2 would multiplex them onto one.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "socks"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["net", "io-util", "time"] }
sha1 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-pki-types = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

# On Windows, the TLS crypto library needs the NASM assembler unless prebuilt
# objects are used. Enabling them means a plain `cargo build` just works.
[target.'cfg(windows)'.dependencies]
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }

[dev-dependencies]
mohona-testserver = { path = "../../tools/testserver" }
tempfile = "3"
tokio.workspace = true
