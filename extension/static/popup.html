<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mohona</title>
    <link rel="stylesheet" href="themes.css" />
    <style>
      :root {
        --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --text: #1b1f27; --muted: #5a6370;
        --accent: #1565c0; --accent-text: #ffffff; --hover: #eef1f5; --selected: #dce9f9;
        --ok: #1b7f3b; --bad: #b3261e; --warn: #8a5a00;
        --hero: linear-gradient(135deg, #2b78d4, #1259b0);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]), :root[data-theme="system"] {
          --bg: #14171c; --panel: #1c2027; --line: #2d333d; --text: #e8eaee; --muted: #9aa3b0;
          --accent: #5b9df0; --accent-text: #08121f; --hover: #252b34; --selected: #22364f;
          --ok: #5cc27a; --bad: #ff8a80; --warn: #e6b450;
          --hero: linear-gradient(135deg, #2a5fa8, #14325c);
          color-scheme: dark;
        }
      }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] {
        --bg: #14171c; --panel: #1c2027; --line: #2d333d; --text: #e8eaee; --muted: #9aa3b0;
        --accent: #5b9df0; --accent-text: #08121f; --hover: #252b34; --selected: #22364f;
        --ok: #5cc27a; --bad: #ff8a80; --warn: #e6b450;
        --hero: linear-gradient(135deg, #2a5fa8, #14325c);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      body { margin: 0; width: 380px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
      button, input, select, textarea { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .muted { color: var(--muted); }

      header { background: var(--hero); color: var(--hero-text, #fff); padding: 14px 14px 18px; position: relative; }
      header .top { display: flex; align-items: center; gap: 8px; }
      header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; flex: 1; }
      header select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; max-width: 120px; }
      
      .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--panel); color: var(--text); font-size: 12px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa3b0; }
      .dot.ready { background: #62e08a; box-shadow: 0 0 0 3px rgba(98,224,138,.28); }
      .dot.stopped { background: #ffd166; }
      .dot.broken { background: #ff7b72; }

      main { padding: 0 12px 12px; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: -12px 0 12px; position: relative; }
      .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
      .stat b { display: block; font-size: 18px; line-height: 1.1; }
      .stat span { font-size: 11px; color: var(--muted); }
      .stat.bad b { color: var(--bad); }
      .stat.ok b { color: var(--ok); }
      .speed { text-align: center; margin: -4px 0 10px; font-size: 12px; color: var(--muted); }
      .speed b { color: var(--text); }

      section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
      h2 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
      button { cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; }
      button:hover:not(:disabled) { background: var(--hover); }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
      button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
      input[type="url"], input[type="number"], textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
      form { display: flex; gap: 6px; }
      form input { flex: 1; min-width: 0; }
      p { margin: 6px 0 0; }

      ul { list-style: none; margin: 0; padding: 0; }
      li { margin: 0; }
      .item { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
      .item:first-child { border-top: 0; }
      .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item small { color: var(--muted); }
      .download { padding: 6px 0; border-top: 1px solid var(--line); }
      .download:first-child { border-top: 0; }
      .download .row { display: flex; justify-content: space-between; gap: 8px; }
      .download .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
      .download small { color: var(--muted); white-space: nowrap; }
      .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 4px 0 2px; }
      .bar > span { display: block; height: 100%; background: var(--accent); transition: width .4s linear; }
      .bar.done > span { background: var(--ok); }
      .bar.idle > span { background: var(--muted); }
      .bar.bad > span { background: var(--bad); }
      .empty { color: var(--muted); padding: 2px 0; }

      details { margin: 0; }
      summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
      .switch { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
      .switch input { accent-color: var(--accent); width: 16px; height: 16px; }
      details label.field { display: block; margin-top: 8px; }
      footer { text-align: center; color: var(--muted); font-size: 11px; padding-bottom: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <h1>Mohona</h1>
        <label><span hidden>Theme</span>
          <select id="theme" aria-label="Colour theme"></select>
        </label>
      </div>
      <div class="pill"><span id="dot" class="dot"></span><span id="status" role="status">Checking…</span></div>
      <button id="start" class="primary" hidden style="margin-top:8px">Start Mohona</button>
    </header>

    <main>
      <div class="stats" aria-label="Download counts">
        <div class="stat"><b id="nActive">0</b><span>Running</span></div>
        <div class="stat"><b id="nWaiting">0</b><span>Waiting</span></div>
        <div class="stat ok"><b id="nDone">0</b><span>Finished</span></div>
        <div class="stat bad"><b id="nFailed">0</b><span>Failed</span></div>
      </div>
      <p class="speed" id="speed" hidden>Total speed <b id="speedNow">0 B/s</b></p>

      <section>
        <h2>Add a download</h2>
        <form id="form">
          <input id="url" type="url" placeholder="Paste a download address" required />
          <button id="add" type="submit" class="primary">Download</button>
        </form>
        <p id="result" role="status"></p>
        <p id="last" class="muted"></p>
      </section>

      <section id="activeBox" hidden>
        <h2>Downloads</h2>
        <ul id="active"></ul>
      </section>

      <section id="recentBox" hidden>
        <h2>Recently finished</h2>
        <ul id="recent"></ul>
      </section>

      <section id="expiredBox" hidden>
        <h2>Expired links</h2>
        <ul id="expired"></ul>
      </section>

      <section>
        <h2>Media on this page</h2>
        <ul id="media"></ul>
      </section>

      <section>
        <details id="more">
          <summary>Settings</summary>
          <label class="switch"><input id="intercept" type="checkbox" /> Take over browser downloads</label>
          <label class="switch"><input id="videoButton" type="checkbox" /> Show a download button on videos</label>
          <label class="switch"><input id="autoRefresh" type="checkbox" /> Refresh expired links automatically</label>
          <label class="field">Leave files smaller than <input id="minMb" type="number" min="0" step="1" style="width:5em;display:inline-block" /> MB to the browser</label>
          <label class="field">Never take downloads from these sites (one per line)
            <textarea id="excluded" rows="3" placeholder="example.com"></textarea>
          </label>
          <p><button id="saveMore" type="button" class="primary">Save</button> <small id="savedMore" class="muted"></small></p>
          <p class="muted">These settings are shared with the Mohona app.</p>
        </details>
      </section>
    </main>
    <footer>Mohona, the estuary for your downloads</footer>
    <script src="popup.js"></script>
  </body>
</html>
