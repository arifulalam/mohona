[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/net",
    "crates/store",
    "crates/manager",
    "crates/cli",
    "tools/testserver",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "fs", "sync", "signal"] }
