name: Release

# Builds Mohona for Windows, Linux and macOS (Apple silicon and Intel), the browser-extension
# uploads for the stores, and a checksum for every file, then publishes them all as one GitHub
# Release. The app's "Install now" reads these checksums (`<file>.sha256`).
#
#   git tag v0.1.0 && git push --tags        # makes a draft release; check it, then publish it
#
# Or run it by hand (Actions → Release → Run workflow): the files are kept as run artifacts and no
# release is made.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows,        os: windows-latest }
          - { name: Linux,          os: ubuntu-22.04 }
          - { name: macOS (Apple),  os: macos-latest }
          - { name: macOS (Intel),  os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            extension/package-lock.json
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build (Linux and macOS)
        if: runner.os != 'Windows'
        run: bash ./scripts/build-unix.sh
      - name: Collect the files and write their checksums
        shell: bash
        run: |
          mkdir -p out
          cd app/src-tauri/target/release/bundle
          find . -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          cd "$GITHUB_WORKSPACE/out"
          # Two Macs build a file with the same name apart from the architecture; Tauri puts it in the name.
          for f in *; do
            if command -v sha256sum >/dev/null; then h=$(sha256sum "$f" | cut -d' ' -f1); else h=$(shasum -a 256 "$f" | cut -d' ' -f1); fi
            echo "$h  $f" > "$f.sha256"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: mohona-${{ matrix.os }}
          path: out/*

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Test and package
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: mohona-extension
          path: extension/dist/store/*.zip

  publish:
    name: Publish the release
    needs: [desktop, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: One list of all checksums
        run: |
          cd files
          cat *.sha256 > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: files/*
