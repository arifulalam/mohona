name: Landing page

# Publishes the site/ folder to GitHub Pages (https://<owner>.github.io/mohona/).
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "app/src/themes.css", "docs/assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep the page's colours the same as the app's
        run: cp app/src/themes.css site/themes.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
