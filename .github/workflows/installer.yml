name: Windows installer

# Builds the installer on a Windows machine. Run it by hand (Actions, "Run workflow") or by
# pushing a tag like v0.1.0. The installer is attached to the run as a download.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mohona-windows-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sha256
